<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Sprinkler Blowout Request | Green Grin Lawns</title>
  <style>
    :root{color-scheme:dark;--green:#07351d;--lime:#8ed23e;--ink:#eff8eb;--muted:#b9cbb8;--card:#102b1b;--line:#36593d}
    *{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#03140b,#0d2818);color:var(--ink);font:16px/1.5 Arial,sans-serif}main{width:min(720px,calc(100% - 28px));margin:28px auto 60px}.brand{font-weight:900;letter-spacing:.06em;color:var(--lime);font-size:14px}.hero{padding:24px 0 18px}.hero h1{font-size:clamp(30px,6vw,48px);line-height:1.05;margin:10px 0}.hero p{color:var(--muted);max-width:620px}.card{background:rgba(16,43,27,.92);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:0 18px 50px #0004}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:grid;gap:6px;font-weight:800;font-size:14px}input,textarea{width:100%;border:1px solid #638166;border-radius:9px;background:#061a0e;color:var(--ink);padding:12px;font:inherit}textarea{min-height:92px;resize:vertical}.full{grid-column:1/-1}.hint{font-size:13px;color:var(--muted);font-weight:400}.button{border:0;border-radius:9px;background:var(--lime);color:#071a0c;padding:13px 18px;font-weight:900;font-size:16px;cursor:pointer}.button.secondary{background:#214b2a;color:var(--ink);border:1px solid #57825b}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.notice{margin-top:16px;padding:14px;border-radius:10px;background:#183f24;border:1px solid #5d955e}.error{background:#4b211c;border-color:#d47a65}.code{font-size:24px;letter-spacing:.1em;color:var(--lime);font-weight:900}.small{font-size:13px;color:var(--muted)}@media(max-width:560px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}
  </style>
</head>
<body>
  <main>
    <div class="brand">GREEN GRIN LAWNS</div>
    <section class="hero">
      <h1>Sprinkler blowout request</h1>
      <p>Tell us about your irrigation system and we’ll follow up with scheduling and pricing. Refer a neighbor and they’ll receive a discount on their blowout.</p>
    </section>
    <section class="card">
      <form id="blowout-form">
        <div class="grid">
          <label>Full name<input name="full_name" autocomplete="name" required /></label>
          <label>Email<input name="email" type="email" autocomplete="email" required /></label>
          <label>Phone<input name="phone" type="tel" autocomplete="tel" /></label>
          <label>Service address<input name="service_address" autocomplete="street-address" required /></label>
          <label>Sprinkler zones<input name="zones" type="number" min="0" max="200" value="0" required /><span class="hint">How many stations/zones?</span></label>
          <label>Spigots<input name="spigots" type="number" min="0" max="100" value="0" required /><span class="hint">Outdoor faucets to drain?</span></label>
          <label class="full">Referral code <span class="hint">Optional. Your neighbor’s code gives you the discount.</span><input id="referral-code" name="referred_by_code" maxlength="40" /></label>
          <label class="full">Notes <textarea name="notes" placeholder="Gate code, controller location, special instructions, or anything else we should know."></textarea></label>
        </div>
        <div class="actions"><button class="button" type="submit">Request sprinkler blowout</button></div>
        <div id="form-result" aria-live="polite"></div>
      </form>
    </section>
  </main>
  <script>
    const form = document.querySelector("#blowout-form");
    const result = document.querySelector("#form-result");
    const referral = new URLSearchParams(location.search).get("ref");
    if (referral) document.querySelector("#referral-code").value = referral.toUpperCase();
    const esc = (value) => String(value || "").replace(/[&<>\"]/g, (char) => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[char]));
    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const submit = form.querySelector("button[type=submit]");
      submit.disabled = true; submit.textContent = "Saving request..."; result.innerHTML = "";
      try {
        const body = Object.fromEntries(new FormData(form).entries());
        const response = await fetch("/.netlify/functions/portal-sprinkler-blowouts", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "Could not save the request.");
        result.innerHTML = `<div class="notice"><strong>Request received.</strong><p>We’ll follow up about scheduling. Your neighbor referral code is:</p><div class="code">${esc(data.share_code)}</div><p class="small">Send this link to a neighbor so they can request a blowout with the discount: <br><span>${esc(data.referral_url)}</span></p><div class="actions"><button class="button secondary" id="copy-link" type="button">Copy referral link</button>${navigator.share ? `<button class="button secondary" id="share-link" type="button">Share link</button>` : ""}</div></div>`;
        document.querySelector("#copy-link")?.addEventListener("click", async () => { await navigator.clipboard.writeText(data.referral_url); document.querySelector("#copy-link").textContent = "Copied"; });
        document.querySelector("#share-link")?.addEventListener("click", async () => { await navigator.share({ title: "Sprinkler blowout discount", text: "Use my Green Grin referral link for a sprinkler blowout discount:", url: data.referral_url }); });
        form.reset();
      } catch (error) { result.innerHTML = `<div class="notice error">${esc(error.message)}</div>`; }
      submit.disabled = false; submit.textContent = "Request sprinkler blowout";
    });
  </script>
</body>
</html>
