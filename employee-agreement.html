<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Green Grin Work Agreement</title><style>
:root{color-scheme:dark;--bg:#03150e;--panel:#0b281b;--line:#2d6538;--lime:#b7ef4b;--text:#f1f6ed;--muted:#b4c8b7}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#02100b,var(--bg));font:16px system-ui,sans-serif;color:var(--text)}main{max-width:720px;margin:0 auto;padding:28px 16px 48px}header{display:flex;align-items:center;gap:12px;margin-bottom:22px}header strong{font-size:20px}section{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;margin:14px 0;box-shadow:0 8px 24px #0004}h1{font-size:26px;margin:0 0 5px}h2{font-size:18px;margin:0 0 12px;color:var(--lime)}.muted{color:var(--muted)}.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.fact{border:1px solid #244b31;border-radius:10px;padding:12px}.fact b{display:block;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px}label{display:block;font-weight:700;margin:14px 0 6px}input,textarea{width:100%;border:1px solid #477b4e;background:#061b12;color:var(--text);border-radius:9px;padding:12px;font:inherit}textarea{min-height:130px;resize:vertical}button{width:100%;border:0;border-radius:10px;padding:14px;background:var(--lime);color:#10240e;font-weight:800;font-size:16px;margin-top:16px;cursor:pointer}button:disabled{opacity:.55}a{color:var(--lime)}.notice{padding:13px;border-radius:9px;background:#34250e;border:1px solid #a56d2d;color:#ffe3ad}.success{background:#12351e;border-color:#4eaa54;color:#e2ffdf}#app[hidden]{display:none}
</style></head><body><main><header><span style="font-size:30px">🌿</span><strong>Green Grin Lawns</strong></header><div id="loading" class="muted">Loading agreement…</div><div id="app" hidden><section><h1 id="title">Job Work Agreement</h1><p class="muted">Review the assigned work, then sign below. Your signature is recorded with this job.</p><div class="facts"><div class="fact"><b>Employee</b><span id="employee"></span></div><div class="fact"><b>Customer</b><span id="customer"></span></div><div class="fact"><b>Address</b><span id="address"></span></div><div class="fact"><b>Due date</b><span id="due"></span></div><div class="fact"><b>Agreed pay</b><span id="pay"></span></div></div></section><section><h2>Work scope</h2><p id="scope" style="white-space:pre-wrap"></p></section><section id="sign-section"><h2>Sign agreement</h2><label for="name">Your full name</label><input id="name" autocomplete="name" placeholder="Type your name"><label for="signature">Signature</label><input id="signature" autocomplete="off" placeholder="Type your full legal name as your signature"><label style="display:flex;gap:10px;align-items:flex-start;font-weight:400"><input id="consent" type="checkbox" style="width:auto;margin-top:4px">I agree to complete the work described above safely, professionally, and by the due date.</label><button id="sign">Sign work agreement</button><div id="result" style="margin-top:12px"></div></section></div></main><script>
const token=new URLSearchParams(location.search).get('token');const $=id=>document.getElementById(id);const escapeHtml=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
async function load(){if(!token){$('loading').textContent='This agreement link is missing its token.';return}try{const r=await fetch('/.netlify/functions/employee-agreements?token='+encodeURIComponent(token));const d=await r.json();if(!r.ok)throw Error(d.error||'Could not load agreement.');const a=d.agreement||{},j=d.job||{},e=d.employee||{};$('title').textContent=a.agreement_title||'Job Work Agreement';$('employee').textContent=e.full_name||'Assigned employee';$('customer').textContent=j.customer_name||'Customer';$('address').textContent=j.address||'Address not listed';$('due').textContent=a.due_date||'To be scheduled';$('pay').textContent=a.pay_amount==null?'See your arrangement':'$'+Number(a.pay_amount).toFixed(2);$('scope').textContent=a.scope||j.service_type||'Complete the assigned work.';$('loading').hidden=true;$('app').hidden=false;if(a.status==='Signed'){$('sign-section').innerHTML='<div class="notice success"><strong>Agreement signed.</strong><p>This work agreement was signed by '+escapeHtml(a.signer_name||e.full_name||'the assigned employee')+'.</p><p class="muted">Signed '+new Date(a.signed_at).toLocaleString()+'</p></div>'}}catch(err){$('loading').innerHTML='<div class="notice">'+escapeHtml(err.message)+'</div>'}}
$('sign')?.addEventListener('click',async()=>{const b=$('sign');if(!$('name').value.trim()||!$('signature').value.trim()||!$('consent').checked){$('result').innerHTML='<div class="notice">Enter your name, signature, and check the agreement box.</div>';return}b.disabled=true;try{const r=await fetch('/.netlify/functions/employee-agreements',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'sign',token,signer_name:$('name').value,signature_data:$('signature').value,signature_type:'typed',consent:true})});const d=await r.json();if(!r.ok)throw Error(d.error||'Could not sign agreement.');$('sign-section').innerHTML='<div class="notice success"><strong>Agreement signed successfully.</strong><p>Thank you. Green Grin has recorded your signature.</p></div>'}catch(err){$('result').innerHTML='<div class="notice">'+escapeHtml(err.message)+'</div>';b.disabled=false}});load();
</script></body></html>
