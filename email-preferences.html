<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Email preferences | Green Grin</title><style>body{margin:0;background:#071711;color:#eff9f1;font:16px/1.5 Arial,sans-serif;display:grid;place-items:center;min-height:100vh;padding:20px}.card{width:min(520px,100%);background:#0d251b;border:1px solid #3b7045;border-radius:16px;padding:24px;box-shadow:0 22px 70px #0008}h1{margin-top:0;color:#a9ef45}p{color:#b8cbb7}.button{border:0;border-radius:9px;background:#a9ef45;color:#092116;padding:12px 16px;font-weight:900;cursor:pointer}.message{margin-top:16px;padding:12px;border-radius:9px;background:#173f24;color:#eff9f1}</style></head><body><main class="card"><h1>Email preferences</h1><p id="copy">Use the button below to stop Green Grin marketing emails.</p><button class="button" id="unsubscribe">Unsubscribe me</button><div class="message" id="message" hidden></div></main><script>const token=new URLSearchParams(location.search).get('token'),button=document.querySelector('#unsubscribe'),message=document.querySelector('#message');button.onclick=async()=>{button.disabled=true;button.textContent='Updating…';const r=await fetch('/.netlify/functions/email-preferences',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token})});const d=await r.json();message.hidden=false;message.textContent=d.message||d.error||'Preference update complete.';if(r.ok)button.remove();else{button.disabled=false;button.textContent='Try again'}};</script></body></html>
