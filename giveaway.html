<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Green Grin Giveaway</title>
  <style>
    :root{--bg:#06140d;--card:#102a1b;--line:#345c3d;--lime:#a9ef45;--ink:#f2f9ed;--muted:#b8cbb7;--red:#ff9c87}*{box-sizing:border-box}body{margin:0;background:radial-gradient(900px 500px at 90% -10%,#245a32,#06140d 65%);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif}main{width:min(760px,calc(100% - 28px));margin:30px auto 60px}.brand{font-weight:900;letter-spacing:.1em;color:var(--lime);font-size:13px}.hero{padding:26px 0 20px}.hero h1{font-size:clamp(34px,7vw,58px);line-height:1.02;margin:10px 0}.hero p{color:var(--muted);max-width:650px}.card{background:rgba(16,42,27,.94);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 20px 60px #0005}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:grid;gap:6px;font-weight:800;font-size:14px}.full{grid-column:1/-1}input,textarea{width:100%;border:1px solid #66856a;border-radius:9px;background:#061a0f;color:var(--ink);padding:12px;font:inherit}textarea{min-height:88px;resize:vertical}.hint{font-size:13px;color:var(--muted);font-weight:400}.checks{display:grid;gap:10px;margin-top:16px}.check{display:flex;align-items:flex-start;gap:10px;font-weight:400}.check input{width:auto;margin-top:5px}.button{border:0;border-radius:10px;background:var(--lime);color:#081b0d;padding:13px 18px;font-weight:900;font-size:16px;cursor:pointer}.button.secondary{background:#204b2b;color:var(--ink);border:1px solid #5b8a61}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.notice{margin-top:16px;padding:15px;border-radius:11px;background:#1a4527;border:1px solid #689f63}.notice.error{background:#4b211c;border-color:#d47a65}.share{margin-top:18px;border:1px solid var(--lime);border-radius:14px;padding:18px;background:#0b2416}.share h2{margin-top:0}.tag{color:var(--lime);font-weight:900}.small{color:var(--muted);font-size:13px}@media(max-width:600px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}
  </style>
</head>
<body><main>
  <div class="brand">GREEN GRIN LAWNS</div>
  <section class="hero"><h1>Enter the giveaway.</h1><p>Upload your best lawn or landscape photo for a chance to win. We’ll review every entry and contact the selected winner.</p></section>
  <section class="card">
    <form id="giveaway-form">
      <input name="website" tabindex="-1" autocomplete="off" style="position:absolute;left:-9999px" aria-hidden="true" />
      <input type="hidden" name="competition_slug" value="seasonal-giveaway" />
      <div class="grid">
        <label>Full name<input name="full_name" autocomplete="name" required /></label>
        <label>Email<input name="email" type="email" autocomplete="email" required /></label>
        <label>Phone number<input name="phone" type="tel" autocomplete="tel" required /></label>
        <label>Address<input name="service_address" autocomplete="street-address" required /></label>
        <label class="full">Your photo<input id="photo" name="photo" type="file" accept="image/jpeg,image/png,image/webp,image/heic" required /><span class="hint">JPG, PNG, WEBP, or HEIC · 8 MB maximum.</span></label>
        <label class="full">Optional note<textarea name="notes" maxlength="1000" placeholder="Tell us what makes this yard or project special."></textarea></label>
      </div>
      <div class="checks">
        <label class="check"><input name="email_marketing_allowed" type="checkbox" value="true" /> <span>Yes, email me future Green Grin offers and giveaway announcements. I can unsubscribe anytime.</span></label>
        <label class="check"><input name="sms_marketing_allowed" type="checkbox" value="true" /> <span>Yes, text me future Green Grin offers. Message rates may apply; I can opt out anytime.</span></label>
        <label class="check"><input name="terms_agreed" type="checkbox" value="true" required /> <span>By submitting, I agree that Green Grin may review this photo and contact me about this giveaway. I confirm I have permission to submit the photo.</span></label>
      </div>
      <div class="actions"><button class="button" id="submit" type="submit">Submit my entry</button></div>
      <div id="result" aria-live="polite"></div>
    </form>
  </section>
</main>
<script>
  const form=document.querySelector('#giveaway-form'),result=document.querySelector('#result'),photoInput=document.querySelector('#photo'),submit=document.querySelector('#submit');
  const esc=v=>String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const OWNER_TAG='@greengrinlawns';
  const PARTNER_TAG='@cherryhillfarms.idaho';
  function readPhoto(file){return new Promise((resolve,reject)=>{if(!file)return reject(new Error('Choose a photo first.'));if(file.size>8*1024*1024)return reject(new Error('Photo must be smaller than 8 MB.'));const reader=new FileReader();reader.onload=()=>resolve({name:file.name,type:file.type,data:reader.result});reader.onerror=()=>reject(new Error('Could not read that photo.'));reader.readAsDataURL(file)})}
  form.addEventListener('submit',async e=>{e.preventDefault();submit.disabled=true;submit.textContent='Uploading entry…';result.innerHTML='';try{const data=Object.fromEntries(new FormData(form).entries());data.email_marketing_allowed=form.email_marketing_allowed.checked;data.sms_marketing_allowed=form.sms_marketing_allowed.checked;data.terms_agreed=form.terms_agreed.checked;data.photo=await readPhoto(photoInput.files[0]);const response=await fetch('/.netlify/functions/giveaway-submissions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const saved=await response.json();if(!response.ok)throw new Error(saved.error||'Could not submit your entry.');const caption=`I entered the Green Grin giveaway! ${OWNER_TAG} ${PARTNER_TAG}`;result.innerHTML=`<div class="notice"><strong>Entry received.</strong><p>Keep this page open for the sharing step.</p></div><div class="share"><h2>One last step: share your entry</h2><p>Post your submission to your story and tag <span class="tag">${OWNER_TAG}</span> and <span class="tag">${PARTNER_TAG}</span>.</p><p class="small">Caption ready to copy: <br><strong>${esc(caption)}</strong></p><div class="actions"><a class="button" href="instagram://story-camera">Open Instagram story</a><a class="button secondary" href="https://www.instagram.com/" target="_blank" rel="noopener">Open Instagram</a><button class="button secondary" id="copy-caption" type="button">Copy caption</button><button class="button secondary" id="share-entry" type="button">Share link</button></div></div>`;document.querySelector('#copy-caption').onclick=async()=>{await navigator.clipboard.writeText(caption);document.querySelector('#copy-caption').textContent='Caption copied'};document.querySelector('#share-entry').onclick=async()=>{if(navigator.share)await navigator.share({title:'Green Grin giveaway',text:caption,url:saved.share_url});else{await navigator.clipboard.writeText(saved.share_url);document.querySelector('#share-entry').textContent='Link copied'}};form.reset()}catch(error){result.innerHTML=`<div class="notice error">${esc(error.message)}</div>`}submit.disabled=false;submit.textContent='Submit my entry'});
</script></body></html>
