<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Project Proposal &amp; Invoice | Green Grin</title>
  <link rel="icon" href="/assets/green-grin-tab-icon.png" />
  <style>
    :root{color-scheme:dark;--green:#8ed23e;--ink:#06170d;--panel:#0d281a;--line:rgba(215,238,207,.18);--muted:#aab9ad}*{box-sizing:border-box}body{margin:0;background:#031008;color:#f3fff0;font:16px/1.55 Arial,sans-serif}header{padding:16px 20px;border-bottom:1px solid var(--line);background:#071c11}header img{display:block;width:min(360px,78vw);max-height:72px;object-fit:contain;object-position:left center}.shell{width:min(820px,calc(100% - 28px));margin:26px auto 70px}.card{margin:14px 0;padding:clamp(18px,4vw,30px);border:1px solid var(--line);border-radius:8px;background:var(--panel);box-shadow:0 24px 60px rgba(0,0,0,.25)}h1,h2{margin:0 0 8px;line-height:1.15}h1{font-size:clamp(28px,6vw,45px)}h2{font-size:22px}.eyebrow{color:var(--green);font-weight:900;text-transform:uppercase}.muted{color:var(--muted)}.scope{white-space:pre-wrap;padding:16px;border-left:4px solid var(--green);background:rgba(142,210,62,.07)}.row{display:flex;justify-content:space-between;gap:20px;padding:12px 0;border-bottom:1px solid var(--line)}.row strong:last-child{text-align:right}.total{font-size:25px}.deposit{color:var(--green)}label{display:grid;gap:6px;margin:13px 0;font-weight:800}input{width:100%;min-height:48px;padding:11px 12px;border:1px solid var(--line);border-radius:6px;background:#07180f;color:#fff;font:inherit}button{min-height:48px;padding:11px 16px;border:0;border-radius:6px;background:var(--green);color:#06170d;font:900 15px Arial;cursor:pointer}button.secondary{background:#183b28;color:#fff;border:1px solid var(--line)}button:disabled{opacity:.5}.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:15px}.consent{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start}.consent input{width:22px;min-height:22px}.signature-modes{display:flex;gap:8px}.signature-modes button{flex:1}.signature-modes button.active{outline:2px solid var(--green)}canvas{width:100%;height:170px;border:1px solid var(--line);border-radius:6px;background:#fff;touch-action:none}.notice{margin-top:12px;padding:12px;border-left:4px solid var(--green);background:rgba(142,210,62,.08)}.error{border-left-color:#ec7a50;background:rgba(236,122,80,.09)}[hidden]{display:none!important}@media print{header,.approval,.actions{display:none}.card{box-shadow:none;border-color:#aaa;background:#fff;color:#111}.muted{color:#555}.scope{background:#f2f7ef}}
  </style>
</head>
<body>
  <header><img src="/assets/green-grin-logo.png" alt="Green Grin Lawn and Landscape" /></header>
  <main class="shell">
    <div id="loading" class="card">Loading your secure proposal...</div>
    <div id="proposal" hidden>
      <section class="card"><p class="eyebrow">Project Proposal &amp; Invoice | <span id="proposal-number"></span></p><h1 id="project-title"></h1><p id="customer-line" class="muted"></p><p id="address"></p><p id="payment-due" class="muted"></p></section>
      <section class="card"><h2>Scope of work</h2><div id="scope" class="scope"></div></section>
      <section class="card"><h2>Project investment</h2><div id="groups"></div><div class="row total"><strong>Project total</strong><strong id="total"></strong></div><div class="row deposit"><strong>Material &amp; equipment deposit</strong><strong id="deposit"></strong></div><p id="payment-terms" class="muted"></p></section>
      <section id="customer-notes-card" class="card" hidden><h2>Project notes</h2><div id="customer-notes" class="scope"></div></section>
      <section id="approval" class="card approval">
        <h2>Approve this proposal</h2>
        <p class="muted">We will email a one-time code to the address on this proposal.</p>
        <div class="actions"><button id="request-code" type="button">Email My Approval Code</button></div>
        <div id="sign-fields" hidden>
          <label>One-time code<input id="approval-code" inputmode="numeric" maxlength="6" autocomplete="one-time-code" /></label>
          <label>Your full legal name<input id="signer-name" autocomplete="name" /></label>
          <div class="signature-modes"><button id="typed-mode" class="secondary active" type="button">Type Signature</button><button id="drawn-mode" class="secondary" type="button">Draw Signature</button></div>
          <label id="typed-signature">Signature<input id="signature-text" placeholder="Type your full name" /></label>
          <div id="drawn-signature" hidden><label>Draw signature</label><canvas id="signature-pad" width="740" height="170"></canvas><button id="clear-signature" class="secondary" type="button">Clear</button></div>
          <label class="consent"><input id="consent" type="checkbox" /><span>I approve this proposal, payment schedule, and change-order terms and authorize Green Grin Lawn &amp; Landscape to perform the described work.</span></label>
          <button id="approve" type="button">Approve &amp; Sign Proposal</button>
        </div>
        <div id="result" aria-live="polite"></div>
      </section>
      <div class="actions"><button class="secondary" type="button" onclick="window.print()">Print Proposal</button></div>
    </div>
  </main>
  <script>
    const api = "/.netlify/functions/portal-proposals";
    const token = new URLSearchParams(location.search).get("token") || "";
    const money = value => Number(value || 0).toLocaleString("en-US", { style: "currency", currency: "USD" });
    const notice = (message, error=false) => `<div class="notice${error ? " error" : ""}">${String(message).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}</div>`;
    async function request(method="GET", body) { const response = await fetch(method === "GET" ? `${api}?token=${encodeURIComponent(token)}` : api, { method, headers:{"Content-Type":"application/json"}, body: body ? JSON.stringify(body) : undefined }); const data = await response.json().catch(()=>({})); if(!response.ok) throw new Error(data.error || "Request failed."); return data; }
    function render(estimate){document.querySelector("#loading").hidden=true;document.querySelector("#proposal").hidden=false;document.querySelector("#proposal-number").textContent=estimate.estimate_number;document.querySelector("#project-title").textContent=estimate.project_title;document.querySelector("#customer-line").textContent=`Prepared for ${estimate.customer_name} | Valid until ${estimate.valid_until || "30 days from issue"}`;document.querySelector("#address").textContent=estimate.service_address || "";document.querySelector("#payment-due").textContent=`Payment due: ${estimate.invoice_due_date ? new Date(`${estimate.invoice_due_date}T12:00:00`).toLocaleDateString() : "Per payment schedule"}`;document.querySelector("#scope").textContent=estimate.project_scope || "";document.querySelector("#groups").innerHTML=Object.entries(estimate.grouped_totals||{}).map(([name,total])=>`<div class="row"><strong>${name}</strong><strong>${money(total)}</strong></div>`).join("");document.querySelector("#total").textContent=money(estimate.total);document.querySelector("#deposit").textContent=money(estimate.deposit_amount);document.querySelector("#payment-terms").textContent=Number(estimate.total)>5000?"Materials and reserved equipment are due before ordering. Half of the remaining balance is due at midpoint and the final balance at completion.":"Materials and reserved equipment are due before ordering. The remaining balance is due at completion.";const notesCard=document.querySelector("#customer-notes-card");notesCard.hidden=!estimate.customer_notes;document.querySelector("#customer-notes").textContent=estimate.customer_notes||"";if(estimate.approved_at){document.querySelector("#approval").innerHTML=`<h2>Proposal approved</h2><p>Signed by <strong>${estimate.approved_by}</strong> on ${new Date(estimate.approved_at).toLocaleString()}.</p>`;}}
    let signatureType="typed", drawing=false, drew=false;const canvas=document.querySelector("#signature-pad"),ctx=canvas.getContext("2d");ctx.lineWidth=3;ctx.lineCap="round";ctx.strokeStyle="#102419";function point(event){const rect=canvas.getBoundingClientRect(),source=event.touches?.[0]||event;return{x:(source.clientX-rect.left)*canvas.width/rect.width,y:(source.clientY-rect.top)*canvas.height/rect.height}}function start(event){drawing=true;drew=true;const p=point(event);ctx.beginPath();ctx.moveTo(p.x,p.y);event.preventDefault()}function move(event){if(!drawing)return;const p=point(event);ctx.lineTo(p.x,p.y);ctx.stroke();event.preventDefault()}function stop(){drawing=false}canvas.addEventListener("pointerdown",start);canvas.addEventListener("pointermove",move);window.addEventListener("pointerup",stop);
    document.querySelector("#typed-mode").onclick=()=>{signatureType="typed";document.querySelector("#typed-signature").hidden=false;document.querySelector("#drawn-signature").hidden=true;document.querySelector("#typed-mode").classList.add("active");document.querySelector("#drawn-mode").classList.remove("active")};document.querySelector("#drawn-mode").onclick=()=>{signatureType="drawn";document.querySelector("#typed-signature").hidden=true;document.querySelector("#drawn-signature").hidden=false;document.querySelector("#drawn-mode").classList.add("active");document.querySelector("#typed-mode").classList.remove("active")};document.querySelector("#clear-signature").onclick=()=>{ctx.clearRect(0,0,canvas.width,canvas.height);drew=false};
    document.querySelector("#request-code").onclick=async()=>{const button=document.querySelector("#request-code");button.disabled=true;try{const data=await request("POST",{action:"request-code",token});document.querySelector("#sign-fields").hidden=false;document.querySelector("#result").innerHTML=notice(data.message)}catch(error){document.querySelector("#result").innerHTML=notice(error.message,true)}finally{button.disabled=false}};
    document.querySelector("#approve").onclick=async()=>{const button=document.querySelector("#approve"),name=document.querySelector("#signer-name").value.trim(),signature=signatureType==="drawn"?(drew?canvas.toDataURL("image/png"):""):document.querySelector("#signature-text").value.trim();if(!signature){document.querySelector("#result").innerHTML=notice("Add your signature before approving.",true);return}button.disabled=true;try{const data=await request("POST",{action:"sign",token,code:document.querySelector("#approval-code").value,signer_name:name,signature_type:signatureType,signature_data:signature,consent:document.querySelector("#consent").checked});render(data.estimate)}catch(error){document.querySelector("#result").innerHTML=notice(error.message,true)}finally{button.disabled=false}};
    request().then(data=>render(data.estimate)).catch(error=>document.querySelector("#loading").innerHTML=notice(error.message,true));
  </script>
</body>
</html>
