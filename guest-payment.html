<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pay Green Grin Invoice</title><script src="https://secure.helcim.app/helcim-pay/services/start.js"></script><style>body{margin:0;background:#03150e;color:#f1f6ed;font:16px system-ui,sans-serif}main{max-width:620px;margin:auto;padding:30px 16px}section{background:#0b281b;border:1px solid #2d6538;border-radius:14px;padding:22px;margin-top:18px}h1{margin:0 0 8px;color:#b7ef4b}p{line-height:1.5}.muted{color:#b4c8b7}.fact{padding:10px 0;border-bottom:1px solid #244b31}.fact b{display:block;color:#b4c8b7;font-size:12px;text-transform:uppercase}.total{font-size:28px;font-weight:800;color:#b7ef4b}button{width:100%;padding:14px;border:0;border-radius:9px;background:#b7ef4b;color:#10240e;font-weight:800;font-size:16px;cursor:pointer}button:disabled{opacity:.55}.notice{margin-top:14px;padding:12px;border-radius:9px;background:#34250e;border:1px solid #a56d2d;color:#ffe3ad}.success{background:#12351e;border-color:#4eaa54;color:#e2ffdf}</style></head><body><main><h1>Green Grin Lawns</h1><p class="muted">Secure invoice payment</p><section id="loading">Loading invoice…</section><section id="invoice" hidden><div class="fact"><b>Customer</b><span id="customer"></span></div><div class="fact"><b>Service</b><span id="service"></span></div><div class="fact"><b>Address</b><span id="address"></span></div><div class="fact"><b>Due</b><span id="due"></span></div><p class="total" id="amount"></p><button id="pay" type="button">Pay with Card</button><div id="result"></div></section></main><script>
const token=new URLSearchParams(location.search).get('token');const $=id=>document.getElementById(id);let checkoutToken='';function notice(t,s=false){return `<div class="notice ${s?'success':''}">${t}</div>`}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]) )}async function load(){if(!token){$('loading').innerHTML=notice('This payment link is missing.');return}try{const r=await fetch('/.netlify/functions/portal-payments?guest_token='+encodeURIComponent(token));const d=await r.json();if(!r.ok)throw Error(d.error||'Payment link unavailable.');const i=d.invoice;$('customer').textContent=i.customer_name||'Customer';$('service').textContent=i.service_line||'Green Grin service';$('address').textContent=i.service_address||'On file';$('due').textContent=i.due_date||'Upon receipt';$('amount').textContent='$'+Number(i.amount||0).toFixed(2);$('loading').hidden=true;$('invoice').hidden=false;if(String(i.status).toLowerCase()==='paid'){$('pay').disabled=true;$('pay').textContent='Invoice already paid';$('result').innerHTML=notice('This invoice is already paid.',true)}}catch(e){$('loading').innerHTML=notice(esc(e.message))}}$('pay').addEventListener('click',async()=>{const b=$('pay');b.disabled=true;b.textContent='Opening secure checkout…';try{const r=await fetch('/.netlify/functions/portal-payments',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'initialize-invoice-checkout',guest_token:token})});const d=await r.json();if(!r.ok)throw Error(d.error||'Could not start checkout.');checkoutToken=d.checkout_token;if(typeof window.appendHelcimPayIframe!=='function')throw Error('Secure checkout did not load. Refresh the page and try again.');window.appendHelcimPayIframe(checkoutToken);b.textContent='Checkout opened'}catch(e){b.disabled=false;b.textContent='Pay with Card';$('result').innerHTML=notice(esc(e.message))}});window.addEventListener('message',async e=>{if(!checkoutToken||e.origin!=='https://secure.helcim.app'||e.data?.eventName!==`helcim-pay-js-${checkoutToken}`)return;if(e.data.eventStatus==='ABORTED'){checkoutToken='';$('pay').disabled=false;$('pay').textContent='Pay with Card';$('result').innerHTML=notice('The payment was cancelled or declined.')}if(e.data.eventStatus!=='SUCCESS')return;try{$('result').innerHTML=notice('Confirming payment…');const r=await fetch('/.netlify/functions/portal-payments',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'confirm-invoice-checkout',guest_token:token,checkout_token:checkoutToken,response:e.data.eventMessage})});const d=await r.json();if(!r.ok)throw Error(d.error||'Payment could not be confirmed.');$('pay').disabled=true;$('pay').textContent='Payment approved';$('result').innerHTML=notice(d.receipt?.sent?'Payment approved. Your receipt was emailed.':'Payment approved. Your invoice is paid.',true)}catch(err){$('result').innerHTML=notice(esc(err.message))}finally{checkoutToken=''}});load();
</script></body></html>
