<!doctype html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Giveaway Review | Green Grin</title><style>:root{--bg:#06140d;--card:#102a1b;--line:#345c3d;--lime:#a9ef45;--ink:#f2f9ed;--muted:#b8cbb7}*{box-sizing:border-box}body{margin:0;background:radial-gradient(900px 500px at 90% -10%,#245a32,#06140d 65%);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif}main{width:min(1100px,calc(100% - 28px));margin:28px auto 60px}.brand{color:var(--lime);font-weight:900;letter-spacing:.1em}.top{display:flex;justify-content:space-between;align-items:end;gap:16px;margin:20px 0}.card{background:rgba(16,42,27,.94);border:1px solid var(--line);border-radius:16px;padding:18px}.toolbar{display:flex;gap:10px;flex-wrap:wrap}.toolbar input,.toolbar select,textarea{background:#061a0f;border:1px solid #66856a;border-radius:8px;color:var(--ink);padding:10px;font:inherit}.toolbar input{flex:1;min-width:220px}.entries{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin-top:16px}.entry{background:#0b2116;border:1px solid var(--line);border-radius:14px;overflow:hidden}.entry img{display:block;width:100%;height:240px;object-fit:cover;background:#071711}.entry-body{padding:15px}.muted{color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.button{border:0;border-radius:8px;background:var(--lime);color:#081b0d;padding:9px 12px;font-weight:900;cursor:pointer}.button.secondary{background:#204b2b;color:var(--ink);border:1px solid #5b8a61}.button.warn{background:#6b3a25;color:#fff}.notice{padding:12px;border-radius:10px;background:#173f24;border:1px solid #64985d;margin-top:12px}.error{background:#4b211c;border-color:#d47a65}@media(max-width:650px){.top{display:block}}
</style></head><body><main><div class="brand">GREEN GRIN GIVEAWAY REVIEW</div><div class="top"><div><h1>Photo entries</h1><p class="muted">Review submissions, choose finalists, and mark the winner.</p></div><button class="button" id="load">Refresh entries</button></div><section class="card"><div class="toolbar"><input id="pin" type="password" placeholder="Admin PIN" autocomplete="current-password"/><select id="filter"><option value="all">All statuses</option><option>pending</option><option>finalist</option><option>winner</option><option>not_selected</option></select></div><div id="message" class="muted"></div></section><section id="entries" class="entries"></section></main><script>
const entriesEl=document.querySelector('#entries'),message=document.querySelector('#message'),pin=document.querySelector('#pin'),filter=document.querySelector('#filter');let entries=[];const esc=v=>String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){message.textContent='Loading…';const r=await fetch('/.netlify/functions/giveaway-submissions',{headers:{'x-admin-pin':pin.value}});const d=await r.json();if(!r.ok){message.textContent=d.error||'Could not load entries.';return}entries=d.entries||[];message.textContent=`${entries.length} entries`;render()}function render(){const shown=filter.value==='all'?entries:entries.filter(x=>x.status===filter.value);entriesEl.innerHTML=shown.map(x=>`<article class="entry"><img src="${esc(x.photo_url)}" alt="Giveaway photo from ${esc(x.full_name)}"/><div class="entry-body"><h2>${esc(x.full_name)}</h2><div>${esc(x.email)} · ${esc(x.phone)}</div><div class="muted">${esc(x.service_address)}</div><p class="muted">Submitted ${new Date(x.created_at).toLocaleString()}<br>Email list: ${x.email_marketing_allowed?'yes':'no'} · Text list: ${x.sms_marketing_allowed?'yes':'no'}</p><textarea data-notes="${esc(x.id)}" placeholder="Reviewer notes">${esc(x.reviewer_notes)}</textarea><div class="actions"><button class="button" data-status="finalist" data-id="${x.id}">Finalist</button><button class="button" data-status="winner" data-id="${x.id}">Winner</button><button class="button warn" data-status="not_selected" data-id="${x.id}">Not selected</button></div></div></article>`).join('')||'<div class="card">No entries match this filter.</div>';entriesEl.querySelectorAll('[data-status]').forEach(b=>b.onclick=()=>update(b.dataset.id,b.dataset.status))}async function update(id,status){const notes=document.querySelector(`[data-notes="${id}"]`)?.value||'';const r=await fetch(`/.netlify/functions/giveaway-submissions?id=${encodeURIComponent(id)}`,{method:'PATCH',headers:{'Content-Type':'application/json','x-admin-pin':pin.value},body:JSON.stringify({status,reviewer_notes:notes})});const d=await r.json();if(!r.ok){message.textContent=d.error||'Update failed';return}await load()}document.querySelector('#load').onclick=load;filter.onchange=render;pin.addEventListener('change',load);
</script></body></html>
